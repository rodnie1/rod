<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Dark overlay */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            text-align: center;

            /* Animation */
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .voice-label {
            font-size: 16px;
            color: #be123c;
            margin-bottom: 16px;
            font-weight: 600;
        }

        audio {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="voice-label">Pakinggan mo mensahe ko sayu bebe😘</div>
        <audio controls>
            <source src="voice.mp3" type="audio/mpeg">
            Hindi supported ang audio.
        </audio>
    </div>
</body>
</html>
