
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8b8cc">
<title>Memories | Nelian 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #e66b9e;
    --soft: #fce4ee;
    --bg: #f5f1f4;
    --text: #35313c;
    --muted: #99939e;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
}

/* MAIN LAYOUT */

.container {
    max-width: 850px;
    margin: 25px auto;
    padding: 0 18px;
}

/* MAIN CONTENT */

.content-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    min-height: 550px;
    box-shadow: 0 3px 15px #00000008;
    display: flex;
    flex-direction: column;
}

.notice {
    flex: 1;
    min-height: 480px;
    background: linear-gradient(
        135deg,
        #e8b8cc,
        #dba3bb,
        #e6bfd0
    );
    border: 1px solid #d69bb5;
    border-radius: 18px;
    padding: 35px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.notice-icon {
    font-size: 65px;
    margin-bottom: 20px;
    filter: grayscale(15%);
}

.status {
    background: #a94370;
    color: white;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

.notice h1 {
    color: #873454;
    font-size: 29px;
    margin-bottom: 15px;
}

.notice p {
    color: #684253;
    font-size: 14px;
    line-height: 1.8;
    max-width: 420px;
}

.back-home {
    display: inline-block;
    margin-top: 25px;
    background: #a94370;
    color: white;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: bold;
    transition: 0.2s;
}

.back-home:hover {
    background: #873454;
    transform: translateY(-2px);
}

.signature {
    text-align: center;
    margin-top: 22px;
    color: var(--muted);
    font-size: 13px;
}

/* DESKTOP NAVIGATION */

.menu {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.menu a {
    text-decoration: none;
    color: #777;
    background: white;
    padding: 13px 25px;
    border-radius: 12px;
    font-size: 14px;
    transition: 0.2s;
}

.menu a:hover,
.menu a.active {
    background: var(--soft);
    color: var(--pink);
}

/* BOTTOM NAVIGATION */

.bottom-nav {
    display: none;
}

/* MOBILE RESPONSIVE */

@media(max-width: 700px) {

    .container {
        margin: 15px auto 100px;
        padding: 0 12px;
    }

    .menu {
        display: none;
    }

    .content-card {
        padding: 12px;
        min-height: 550px;
    }

    .notice {
        min-height: 500px;
        padding: 25px 15px;
    }

    .notice-icon {
        font-size: 55px;
    }

    .notice h1 {
        font-size: 24px;
    }

    .notice p {
        font-size: 13px;
    }

    /* SAME FLOATING NAVIGATION AS HOMEPAGE */

    .bottom-nav {
        display: flex;
        position: fixed;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(270px, 85%);
        min-height: 58px;
        padding: 6px 9px;
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid #f7dce8;
        border-radius: 22px;
        box-shadow: 0 5px 22px rgba(219, 133, 171, .18);
        justify-content: space-around;
        align-items: center;
        gap: 5px;
        z-index: 9999;
    }

    .bottom-nav a {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 5px 3px;
        border-radius: 14px;
        color: #b5a1ad;
        text-decoration: none;
        font-size: 9px;
        font-weight: 600;
        transition: .2s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .bottom-nav span {
        width: 28px;
        height: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        border-radius: 10px;
        transition: .2s ease;
    }

    .bottom-nav a.active {
        color: #ed6fa6;
        background: #fff0f6;
    }

    .bottom-nav a.active span {
        background: #ffffff;
        box-shadow: 0 2px 7px rgba(244, 119, 173, .12);
        transform: translateY(-1px);
    }

    .bottom-nav a:active {
        transform: scale(.94);
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- DESKTOP NAVIGATION -->

    <nav class="menu">
        <a href="../index.html">🏠 Home</a>
        <a href="../games/index.html">🎮 Games</a>
        <a class="active" href="index.html">♡ Memories</a>
    </nav>

    <!-- MAIN CONTENT -->

    <main class="content-card">

        <section class="notice">

            <div class="notice-icon">🌸</div>

            <div class="status">ON HOLD</div>

            <h1>Temporarily Unavailable</h1>

            <p>
                Oops! This section is currently unavailable.
                <br>
                I'm still working on this feature.
                <br><br>
                Please come back again soon.
                Something special is waiting for you here! 💗
            </p>

            <a href="../index.html" class="back-home">
                Back to Home ♡
            </a>

        </section>

        <div class="signature">
            Made with love, just for you. ♡<br>
            — Rodnie
        </div>

    </main>

</div>

<!-- MOBILE BOTTOM NAVIGATION -->

<nav class="bottom-nav">

    <a href="../index.html">
        <span>⌂</span>
        Home
    </a>

    <a href="games.html">
        <span>🎮</span>
        Games
    </a>

    <a class="active" href="index.html">
        <span>♡</span>
        Memories
    </a>

</nav>

</body>
</html>
